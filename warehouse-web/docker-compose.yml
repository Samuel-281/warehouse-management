services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: warehouse-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse_management
    ports:
      - "5432:5432"
    volumes:
      - warehouse_management_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  warehouse_management_postgres:
